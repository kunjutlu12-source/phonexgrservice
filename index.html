<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RemoteFix | Pro Tech Support</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #030712 !important;
            color: #f3f4f6 !important;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Arka Plan Neon Işık Efektleri */
        .neon-glow-1 {
            position: absolute;
            top: -100px;
            left: -100px;
            width: 350px;
            height: 350px;
            background: rgba(6, 182, 212, 0.12);
            filter: blur(90px);
            border-radius: 50%;
            z-index: 0;
        }

        .neon-glow-2 {
            position: absolute;
            bottom: -100px;
            right: -100px;
            width: 350px;
            height: 350px;
            background: rgba(37, 211, 102, 0.1);
            filter: blur(90px);
            border-radius: 50%;
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(6, 182, 212, 0.1);
            backdrop-filter: blur(16px);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 1.85rem;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #cbd5e1;
            letter-spacing: 0.025em;
        }

        input, textarea, select {
            width: 100%;
            padding: 0.8rem 1rem;
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
        }

        .phone-container {
            display: flex;
            gap: 0.5rem;
        }

        .phone-container select {
            flex: 0 0 140px;
            background-color: #0b1329;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }

        .phone-container input {
            flex: 1;
            letter-spacing: 0.5px;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn-submit {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: #64748b;
            font-size: 0.8rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #1e293b;
        }

        .divider span {
            padding: 0 1rem;
        }

        .whatsapp-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            width: 100%;
            padding: 0.9rem;
            background: rgba(37, 211, 102, 0.1);
            color: #25d366;
            border: 1px solid #25d366;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .whatsapp-btn:hover {
            background: #25d366;
            color: #030712;
            box-shadow: 0 0 20px rgba(37, 211, 102, 0.4);
            transform: translateY(-2px);
        }

        .status-message {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
            display: none;
            padding: 0.5rem;
            border-radius: 8px;
        }
    </style>
</head>

    </div>

    <script>
        const phoneInput = document.getElementById('phone');
        const countrySelect = document.getElementById('countryCode');

        function getMaxDigits() {
            const selected = countrySelect.options[countrySelect.selectedIndex];
            return parseInt(selected.getAttribute('data-digits')) || 10;
        }

        countrySelect.addEventListener('change', function() {
            phoneInput.value = '';
        });

        phoneInput.addEventListener('input', function (e) {
            let maxDigits = getMaxDigits();
            let val = e.target.value.replace(/\D/g, '');
            
            if (val.length > maxDigits) {
                val = val.substring(0, maxDigits);
            }
            
            e.target.value = val;
        });

        // Formspree Gönderim İşlemi
        const form = document.getElementById('repairForm');
        const statusDiv = document.getElementById('status');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = form.querySelector('.btn-submit');
            submitBtn.textContent = 'Sending...';
            submitBtn.disabled = true;

            const formData = new FormData(form);
            
            try {
                const response = await fetch(form.action, {
                    method: form.method,
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });

                statusDiv.style.display = 'block';
                if (response.ok) {
                    statusDiv.style.background = 'rgba(37, 211, 102, 0.15)';
                    statusDiv.style.color = '#25d366';
                    statusDiv.innerText = "Request sent successfully! We will contact you soon.";
                    form.reset();
                } else {
                    statusDiv.style.background = 'rgba(239, 68, 68, 0.15)';
                    statusDiv.style.color = '#ef4444';
                    statusDiv.innerText = "Failed to send request. Please try via WhatsApp.";
                }
            } catch (error) {
                statusDiv.style.display = 'block';
                statusDiv.style.background = 'rgba(239, 68, 68, 0.15)';
                statusDiv.style.color = '#ef4444';
                statusDiv.innerText = "Network error. Please check your connection.";
            } finally {
                submitBtn.textContent = 'Request Remote Fix';
                submitBtn.disabled = false;
            }
        });
    </script>
